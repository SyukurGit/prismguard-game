<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>LUMENCAIRN: The Prismatic Bastion</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #06080d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cinzel", "Georgia", serif;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e2e8f0;
    }
    #stage-container {
      position: relative;
      width: 1280px;
      height: 720px;
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: 16 / 9;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.95), 0 0 25px rgba(56, 189, 248, 0.25);
      border: 2px solid #1e293b;
      background: #030712;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }
    #audio-indicator {
      position: absolute;
      bottom: 12px;
      right: 16px;
      font-size: 11px;
      color: #38bdf8;
      letter-spacing: 1px;
      pointer-events: none;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div id="stage-container">
    <canvas id="viewport" width="1280" height="720"></canvas>
    <div id="audio-indicator">AUDIO: MULTI-CHANNEL HARMONIC SYNTH ACTIVE</div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
